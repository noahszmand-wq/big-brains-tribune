<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<title>BBT Trade Calculator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FF6A1F'/%3E%3Ctext x='32' y='42' font-family='Arial Black,Arial' font-weight='900' font-size='24' text-anchor='middle' fill='%230A1220'%3EBBT%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #F6F3EC; --surface: #FFFFFF; --surface-2: #EEE9DE; --ink: #14202F; --ink-2: #5E6B7D; --rule: #DAD3C5;
  --pylon: #E55A12; --on-pylon: #FFFFFF; --yellow: #E6BF00; --on-yellow: #14202F; --win: #1F9A5F; --loss: #D23B3B; --blue: #1F4FB4;
  --t1: #7C8CFF; --t2: #B07CFF; --t3: #E07A9A; --t4: #4FB3BF; --t5: #E8604C; --t6: #5BA4E6; --t7: #D2B271; --t8: #9CC24A; --t9: #B08463; --t10: #A6AFC0;
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif; --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1220; --surface: #101B2D; --surface-2: #17243A; --ink: #EAF0F7; --ink-2: #9BA9BD; --rule: #22314A;
  --pylon: #FF6A1F; --on-pylon: #0A1220; --yellow: #FFD60A; --on-yellow: #0A1220; --win: #3DD68C; --loss: #FF7070; --blue: #2E63D6;
} }
:root[data-theme="dark"] {
  --bg: #0A1220; --surface: #101B2D; --surface-2: #17243A; --ink: #EAF0F7; --ink-2: #9BA9BD; --rule: #22314A;
  --pylon: #FF6A1F; --on-pylon: #0A1220; --yellow: #FFD60A; --on-yellow: #0A1220; --win: #3DD68C; --loss: #FF7070; --blue: #2E63D6;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 64px; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* Top bar + side menu (same as the desk) */
.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--rule); padding-top: env(safe-area-inset-top); }
.top .in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.brand .mark { background: var(--pylon); color: var(--on-pylon); font-family: var(--display); font-weight: 900; font-size: 0.95rem; padding: 4px 7px 3px; line-height: 1; }
.brand .word { font-family: var(--display); font-weight: 800; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; }
.menu-btn { width: 44px; height: 44px; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; display: grid; place-items: center; gap: 4px; padding: 11px 10px; flex: none; }
.menu-btn i { display: block; width: 20px; height: 2px; background: var(--ink); border-radius: 2px; }
.src { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin: 0 0 12px; }
.src button { flex: 1; border: 0; background: var(--surface); padding: 8px 6px; font-size: 0.85rem; font-weight: 700; color: var(--ink-2); }
.src button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.src .k { flex: none; display: grid; place-items: center; padding: 0 10px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); }
.ddrawer-bg { position: fixed; inset: 0; background: rgba(5, 10, 20, 0.55); z-index: 50; }
.ddrawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); background: var(--surface); border-right: 1px solid var(--rule); z-index: 51; padding: calc(14px + env(safe-area-inset-top)) 16px 24px; overflow-y: auto; animation: din 0.18s ease-out; }
@keyframes din { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
.ddrawer .dh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.ddrawer .dclose { width: 40px; height: 40px; border: 1px solid var(--rule); background: var(--bg); border-radius: 10px; }
.ddrawer .lab { display: block; margin: 14px 0 6px; }
.dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.dlist a, .dlist summary { display: grid; gap: 2px; text-decoration: none; background: var(--bg); border: 1px solid var(--rule); padding: 10px 14px; min-height: 56px; position: relative; cursor: pointer; color: inherit; }
.dlist a .mono, .dlist summary .mono { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pylon); }
.dlist a b, .dlist summary b { font-family: var(--display); font-weight: 800; font-size: 1.2rem; line-height: 1; text-transform: uppercase; }
.dlist a em { position: absolute; right: 12px; top: 12px; font-style: normal; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: var(--yellow); color: var(--on-yellow); padding: 3px 6px; border-radius: 4px; }
.dlist a[aria-current="page"] { border-color: var(--yellow); }
.dlist details { border: 1px solid var(--rule); background: var(--bg); }
.dlist details summary { border: 0; list-style: none; padding-left: 40px; }
.dlist details summary::-webkit-details-marker { display: none; }
.dlist details summary::before { content: ""; position: absolute; left: 12px; top: 18px; width: 18px; height: 14px; border: 2px solid var(--pylon); border-radius: 3px; box-shadow: inset 0 3px 0 0 var(--pylon); }
.dlist details summary::after { content: "›"; position: absolute; right: 14px; top: 10px; font-size: 1.4rem; color: var(--ink-2); transform: rotate(90deg); transition: transform 0.15s; }
.dlist details[open] summary::after { transform: rotate(-90deg); }
.dlist details .dlist { padding: 0 8px 8px; }
.dlist details .dlist a { background: var(--surface); }

/* Type + bits */
h1 { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 2.4rem; line-height: 0.95; margin: 0 0 6px; }
h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 1.5rem; line-height: 1; margin: 22px 0 10px; }
.lab { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.dim { color: var(--ink-2); } .small { font-size: 0.88rem; }
p { margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--rule); padding: 14px; margin-bottom: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; font-weight: 600; }
.btn.primary { background: var(--pylon); color: var(--on-pylon); border-color: var(--pylon); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 0.9rem; }
.btn.block { width: 100%; }
input[type=password], select { width: 100%; min-height: 48px; background: var(--bg); border: 1px solid var(--rule); padding: 10px 12px; font-size: 16px; border-radius: 6px; }
.msg { min-height: 1.4em; font-size: 0.92rem; } .msg.err { color: var(--loss); }
.gate { padding-top: 10vh; } .gate .card { border-top: 6px solid var(--yellow); padding: 24px 20px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.tabs { display: flex; gap: 6px; margin: 12px 0 10px; border-bottom: 1px solid var(--rule); }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 10px; font-weight: 700; color: var(--ink-2); margin-bottom: -1px; }
.tabs button[aria-current="true"] { color: var(--ink); border-color: var(--pylon); }
.tb { display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 5px; border-radius: 4px; background: var(--c, var(--ink-2)); color: #0A1220; font-family: var(--display); font-weight: 900; font-size: 0.8rem; letter-spacing: 0.02em; }
.pos { display: inline-block; min-width: 30px; text-align: center; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.04em; border-radius: 3px; padding: 1px 4px; color: #0A1220; }
.pos.QB { background: #E07A9A; } .pos.RB { background: #8FE3B5; } .pos.WR { background: #5BA4E6; } .pos.TE { background: #FFD60A; } .pos.PICK { background: #D2B271; } .pos.K, .pos.DEF { background: #A6AFC0; }

/* Calculator */
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .sides { grid-template-columns: 1fr; } }
.side { background: var(--surface); border: 1px solid var(--rule); padding: 10px; min-width: 0; }
.side .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.side .hd select { min-height: 40px; padding: 6px 8px; font-size: 0.95rem; }
.side .rec { font-size: 0.78rem; color: var(--ink-2); margin: -4px 0 8px; }
.gives { min-height: 44px; border: 1px dashed var(--rule); padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; background: var(--bg); }
.gives .empty { color: var(--ink-2); font-size: 0.85rem; padding: 6px 4px; }
.asset { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 0.88rem; font-weight: 600; line-height: 1.2; max-width: 100%; }
.asset .v { color: var(--ink-2); font-weight: 500; font-size: 0.78rem; }
.asset .x { color: var(--ink-2); font-weight: 700; }
.roster { display: grid; gap: 4px; max-height: 420px; overflow-y: auto; border-top: 1px solid var(--rule); padding-top: 8px; }
.roster .grp { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin: 6px 0 2px; }
.roster button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 0.92rem; min-height: 40px; }
.roster button:hover { background: var(--surface-2); }
.roster button.in { background: var(--surface-2); outline: 2px solid var(--pylon); }
.roster button small { display: block; color: var(--ink-2); font-size: 0.74rem; }
.roster button .vals { text-align: right; font-size: 0.8rem; color: var(--ink-2); line-height: 1.2; white-space: nowrap; }
.roster button .vals b { display: block; color: var(--ink); font-size: 0.95rem; }
.roster button:focus-visible { outline: 3px solid var(--ink); }
.verdict { background: var(--surface); border: 1px solid var(--rule); border-left: 6px solid var(--pylon); padding: 14px; margin: 12px 0; }
.verdict .big { font-family: var(--display); font-weight: 900; text-transform: uppercase; font-size: 1.8rem; line-height: 0.95; }
.verdict .bar { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; display: flex; margin: 10px 0 4px; }
.verdict .bar i { display: block; height: 100%; }
.verdict .bar i.a { background: var(--ca, var(--pylon)); } .verdict .bar i.b { background: var(--cb, var(--blue)); }
.verdict .legend { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--ink-2); }
.cmp { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 8px; }
.cmp th, .cmp td { padding: 6px 6px; border-bottom: 1px solid var(--rule); text-align: right; vertical-align: top; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp th { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.cmp tr.tot td { font-weight: 800; border-top: 2px solid var(--ink); }
.cmp td .who { display: block; font-size: 0.72rem; color: var(--ink-2); }
.srcline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.srcline > div { background: var(--bg); border: 1px solid var(--rule); padding: 8px 10px; border-radius: 6px; }
.srcline .k { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.srcline .r { font-weight: 800; }
.srcline .r.win { color: var(--win); } .srcline .r.even { color: var(--ink); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.note { font-size: 0.82rem; color: var(--ink-2); margin-top: 8px; }

/* Suggested trades */
.needs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
.needs div { background: var(--surface); border: 1px solid var(--rule); padding: 8px 10px; border-radius: 6px; }
.needs .k { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.needs .v { font-weight: 800; }
.sug { background: var(--surface); border: 1px solid var(--rule); padding: 12px; margin-bottom: 10px; }
.sug .tag { display: inline-block; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: var(--yellow); color: var(--on-yellow); padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; }
.sug .tag.rebuild { background: var(--blue); color: #fff; }
.sug .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
.sug .row .arrow { font-family: var(--display); font-weight: 900; font-size: 1.4rem; color: var(--ink-2); padding-top: 4px; }
.sug .row .k { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.sug .row ul { list-style: none; margin: 2px 0 0; padding: 0; font-weight: 600; font-size: 0.92rem; }
.sug .row li small { color: var(--ink-2); font-weight: 500; }
.sug .why { font-size: 0.85rem; color: var(--ink-2); margin-top: 8px; }
.sug .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.sug .foot .vals { font-size: 0.8rem; color: var(--ink-2); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--rule); border-top-color: var(--pylon); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
footer { text-align: center; font-size: 0.8rem; color: var(--ink-2); padding: 20px 16px; }
</style>
</head>
<body>
<header class="top"><div class="in">
  <button type="button" class="menu-btn" id="menubtn" aria-expanded="false" aria-controls="ddrawer" aria-label="Open the menu"><i></i><i></i><i></i></button>
  <a class="brand" href="#" id="brand"><span class="mark">BBT</span><span class="word">Trade calc</span></a>
</div></header>
<main class="wrap"><div class="src" id="src" role="group" aria-label="Value source" hidden><span class="k">Values</span><button type="button" data-s="both" aria-pressed="true">Both</button><button type="button" data-s="fc" aria-pressed="false">FantasyCalc</button><button type="button" data-s="dd" aria-pressed="false">Dynasty Daddy</button></div><div id="app" aria-live="polite"></div></main>
<footer id="foot"></footer>
<div class="ddrawer-bg" id="ddbg" hidden></div>
<aside class="ddrawer" id="ddrawer" aria-label="Menu" hidden>
  <div class="dh"><span class="brand"><span class="mark">BBT</span><span class="word">Tribune</span></span><button type="button" class="dclose" id="ddclose" aria-label="Close">✕</button></div>
  <span class="lab">The paper</span>
  <ul class="dlist" id="dissues"><li><a href="/big-brains-tribune/"><span class="mono">Latest issue</span><b>Read the Tribune</b></a></li></ul>
  <span class="lab">Tools</span>
  <ul class="dlist"><li><a href="/big-brains-tribune/trade/" aria-current="page"><span class="mono">Trade calculator</span><b>Value a trade</b></a></li><li><a href="/big-brains-tribune/desk/"><span class="mono">Contributor Desk</span><b>File your column</b></a></li></ul>
  <p class="dim small">Big Brains Only. League word required.</p>
</aside>

<script>
(() => {
"use strict";
const ENDPOINT = "https://eempzkiumbnffftkqdas.supabase.co/functions/v1/tribune-values";
const $ = (sel, root = document) => root.querySelector(sel);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const store = { get(k) { try { return localStorage.getItem("bbtdesk_" + k); } catch (_) { return null; } }, set(k, v) { try { if (v == null) localStorage.removeItem("bbtdesk_" + k); else localStorage.setItem("bbtdesk_" + k, v); } catch (_) {} } };
const S = { word: store.get("word"), data: null, src: store.get("tradesrc") || "both", tab: "calc", a: null, b: null, give: { a: new Set(), b: new Set() }, sugTeam: null, sugCache: {} };
const SRC_NAME = { fc: "FantasyCalc", dd: "Dynasty Daddy", both: "Both" };

// ---------- side menu ----------
const drawer = $("#ddrawer"), ddbg = $("#ddbg");
const openMenu = (o) => { drawer.hidden = !o; ddbg.hidden = !o; $("#menubtn").setAttribute("aria-expanded", String(o)); };
$("#menubtn").onclick = () => openMenu(true); $("#ddclose").onclick = () => openMenu(false); ddbg.onclick = () => openMenu(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") openMenu(false); });
fetch("/big-brains-tribune/issues.json", { cache: "no-store" }).then((r) => r.json()).then((j) => {
  const list = $("#dissues"), issues = [...(j.issues || [])].sort((x, y) => y.week - x.week); if (!issues.length) return;
  const li = (x, latest) => `<li><a href="${latest ? "/big-brains-tribune/" : `/big-brains-tribune/week-${x.week}/`}"><span class="mono">Issue No. ${x.issue}</span><b>Week ${x.week}</b>${latest ? "<em>Latest</em>" : ""}</a></li>`;
  list.innerHTML = li(issues[0], true) + (issues.length > 1 ? `<li><details><summary><span class="mono">BBArchive</span><b>${issues.length - 1} past issue${issues.length === 2 ? "" : "s"}</b></summary><ul class="dlist">${issues.slice(1).map((x) => li(x, false)).join("")}</ul></details></li>` : "");
}).catch(() => {});

// ---------- data ----------
async function load(word) {
  const r = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ word }) });
  const j = await r.json().catch(() => ({ ok: false, error: "error" }));
  if (!j.ok) throw Object.assign(new Error(j.error || "error"), { code: j.error || "error" });
  return j;
}
// One number per asset for the maths: FantasyCalc's scale, with Dynasty Daddy rescaled onto it so "Both" is a fair average.
function prep(d) {
  const P = d.players, ids = Object.keys(P).filter((id) => P[id].fc.value > 0 && P[id].dd.value > 0).sort((x, y) => P[y].fc.value - P[x].fc.value).slice(0, 60);
  const scale = ids.length ? ids.reduce((s, id) => s + P[id].fc.value, 0) / ids.reduce((s, id) => s + P[id].dd.value, 0) : 1;
  d.scale = scale;
  d.assets = {};
  for (const [id, p] of Object.entries(P)) d.assets[id] = { id, kind: "player", name: p.name, pos: p.pos, team: p.team, age: p.age, fc: p.fc.value, dd: p.dd.value, ddn: Math.round(p.dd.value * scale), rank: p.fc.rank, posRank: p.fc.posRank, trend: p.fc.trend };
  for (const pk of d.picks) d.assets[pk.id] = { id: pk.id, kind: "pick", name: pk.label, pos: "PICK", team: null, age: null, fc: pk.fc, dd: pk.dd, ddn: Math.round(pk.dd * scale), season: pk.season, round: pk.round, owner: pk.owner };
  d.byRid = Object.fromEntries(d.teams.map((t) => [t.rid, t]));
  d.holdings = {};
  for (const t of d.teams) d.holdings[t.rid] = [...t.players, ...d.picks.filter((p) => p.owner === t.rid).map((p) => p.id)];
}
const val = (a, src = S.src) => src === "fc" ? a.fc : src === "dd" ? a.ddn : (a.fc && a.ddn ? (a.fc + a.ddn) / 2 : a.fc || a.ddn);
const teamColor = (t) => `var(${t.c})`;
const badge = (t) => `<span class="tb" style="--c:var(${t.c})">${esc(t.k)}</span>`;

// ---------- lineup maths for suggestions ----------
const SLOT_OK = { QB: ["QB"], RB: ["RB"], WR: ["WR"], TE: ["TE"], FLEX: ["RB", "WR", "TE"], SUPER_FLEX: ["QB", "RB", "WR", "TE"], K: ["K"], DEF: ["DEF"] };
function lineupValue(ids, d) {
  const A = ids.map((id) => d.assets[id]).filter((a) => a && a.kind === "player").sort((x, y) => val(y) - val(x));
  const used = new Set(); let total = 0;
  const fixed = d.settings.slots.filter((s) => SLOT_OK[s] && SLOT_OK[s].length === 1), flex = d.settings.slots.filter((s) => SLOT_OK[s] && SLOT_OK[s].length > 1);
  for (const s of [...fixed, ...flex]) { const a = A.find((x) => !used.has(x.id) && SLOT_OK[s].includes(x.pos)); if (a) { used.add(a.id); total += val(a); } }
  const bench = A.filter((x) => !used.has(x.id)).reduce((s, x) => s + val(x), 0);
  return { starters: total, bench };
}
// What a team is playing for decides what "better" means: contenders want this year's lineup, rebuilders want youth and picks.
const contending = (t, d) => t.seed <= Math.ceil(d.teams.length / 2);
function futureValue(ids, d) {
  return ids.reduce((s, id) => { const a = d.assets[id]; if (!a) return s; const v = val(a); if (a.kind === "pick") return s + v * 1.1; const age = a.age ?? 26; return s + v * (age <= 24 ? 1.12 : age <= 26 ? 1.04 : age <= 28 ? 0.96 : 0.82); }, 0);
}
function objective(t, ids, d) { if (contending(t, d)) { const l = lineupValue(ids, d); return l.starters + 0.15 * l.bench; } return futureValue(ids, d); }
function combos(arr, k) { const out = []; if (k === 1) return arr.map((x) => [x]); for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) out.push([arr[i], arr[j]]); return out; }
function suggest(rid, d) {
  if (S.sugCache[S.src + ":" + rid]) return S.sugCache[S.src + ":" + rid];
  const me = d.byRid[rid], mine = d.holdings[rid];
  const pool = (ids) => { const pl = ids.filter((id) => d.assets[id].kind === "player" && val(d.assets[id]) > 0).sort((x, y) => val(d.assets[y]) - val(d.assets[x])).slice(0, 11); const pk = ids.filter((id) => d.assets[id].kind === "pick" && val(d.assets[id]) > 0); return [...pl, ...pk]; };
  const myPool = pool(mine), myCombos = [...combos(myPool, 1), ...combos(myPool, 2)];
  const base = objective(me, mine, d);
  const out = [];
  for (const them of d.teams) {
    if (them.rid === rid) continue;
    const theirs = d.holdings[them.rid], theirPool = pool(theirs), theirBase = objective(them, theirs, d);
    const theirCombos = [...combos(theirPool, 1), ...combos(theirPool, 2)];
    for (const give of myCombos) {
      const gv = give.reduce((s, id) => s + val(d.assets[id]), 0); if (!gv) continue;
      for (const get of theirCombos) {
        const rv = get.reduce((s, id) => s + val(d.assets[id]), 0); if (!rv) continue;
        const diff = Math.abs(gv - rv) / Math.max(gv, rv); if (diff > 0.12) continue;
        if (give.length === 2 && get.length === 2 && give.every((id) => d.assets[id].kind === "pick") && get.every((id) => d.assets[id].kind === "pick")) continue;
        const giveSet = new Set(give), getSet = new Set(get);
        const myAfter = [...mine.filter((id) => !giveSet.has(id)), ...get], theirAfter = [...theirs.filter((id) => !getSet.has(id)), ...give];
        const g1 = objective(me, myAfter, d) - base; if (g1 <= 0) continue;
        const g2 = objective(them, theirAfter, d) - theirBase; if (g2 <= 0) continue;
        out.push({ them, give, get, gv, rv, g1, g2, score: Math.min(g1, g2) * 2 + (g1 + g2) * 0.5 - diff * 1500 });
      }
    }
  }
  out.sort((x, y) => y.score - x.score);
  // One suggestion per partner first, then the rest, so the list isn't nine versions of the same deal.
  const seen = new Map(), pkg = new Map(), top = [], rest = [];
  for (const s of out) {
    const key = s.them.rid, pk = [...s.give].sort().join("+"); if ((pkg.get(pk) || 0) >= 3) continue; // and not the same package nine times over
    if (!seen.has(key)) { seen.set(key, 1); pkg.set(pk, (pkg.get(pk) || 0) + 1); top.push(s); } else if (seen.get(key) < 3) { seen.set(key, seen.get(key) + 1); pkg.set(pk, (pkg.get(pk) || 0) + 1); rest.push(s); }
  }
  const res = [...top, ...rest].slice(0, 12);
  S.sugCache[S.src + ":" + rid] = res; return res;
}
function needs(rid, d) {
  const t = d.byRid[rid], ids = d.holdings[rid];
  const byPos = {}; for (const id of ids) { const a = d.assets[id]; if (a.kind !== "player") continue; (byPos[a.pos] ??= []).push(val(a)); }
  const starters = { QB: 2, RB: 2, WR: 3, TE: 1 }; // superflex: a second QB starts
  const rows = Object.entries(starters).map(([pos, n]) => { const v = (byPos[pos] || []).sort((x, y) => y - x); const start = v.slice(0, n).reduce((s, x) => s + x, 0) / n || 0; const depth = v.slice(n).reduce((s, x) => s + x, 0); return { pos, start, depth, count: v.length }; });
  const weakest = [...rows].sort((x, y) => x.start - y.start)[0], deepest = [...rows].sort((x, y) => y.depth - x.depth)[0];
  const picks = ids.filter((id) => d.assets[id].kind === "pick").length;
  return { t, rows, weakest, deepest, picks, mode: contending(t, d) ? "contending" : "rebuilding" };
}

// ---------- views ----------
function render() {
  app.innerHTML = "";
  $("#src").hidden = !(S.word && S.data);
  if (!S.word || !S.data) return gate();
  app.appendChild(el(`<div><div class="tabs" role="tablist"><button type="button" data-t="calc" ${S.tab === "calc" ? "aria-current=true" : ""}>Calculator</button><button type="button" data-t="sug" ${S.tab === "sug" ? "aria-current=true" : ""}>Suggested trades</button></div><div id="tab"></div></div>`));
  app.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { S.tab = b.dataset.t; render(); });
  (S.tab === "sug" ? suggestions : calculator)($("#tab"));
  const d = S.data;
  $("#foot").innerHTML = `Values: FantasyCalc (${new Date(d.sources.fc.at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric" })})${d.sources.dd.ok ? ` · Dynasty Daddy (${new Date(d.sources.dd.at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric" })})` : " · Dynasty Daddy unavailable right now"} · dynasty, superflex, PPR. Rosters from Sleeper. Nobody's bound by any of this.`;
}
function gate(err) {
  const v = el(`<div class="gate"><div class="card"><h1>Trade calculator</h1><p class="dim">League word, then value any deal in Big Brains Only.</p>
    <form id="gf"><div class="field"><label class="lab" for="gw">League word</label><input id="gw" type="password" autocapitalize="off" autocomplete="off" required></div>
    <button class="btn primary block" type="submit">Open</button><p class="msg err" id="gmsg">${esc(err || "")}</p></form></div></div>`);
  app.appendChild(v);
  $("#gf", v).onsubmit = async (e) => {
    e.preventDefault(); const w = norm($("#gw", v).value); if (!w) return;
    const b = $("button", v); b.disabled = true; $("#gmsg", v).textContent = "";
    try { await start(w); } catch (err) { b.disabled = false; $("#gmsg", v).textContent = err.code === "wrong_word" ? "That's not the league word." : "Couldn't load values right now. Try again in a minute."; }
  };
}
async function start(word) {
  app.innerHTML = `<p class="dim" style="padding-top:24px"><span class="spin"></span> Pulling rosters and values…</p>`;
  const d = await load(word); prep(d);
  S.word = word; store.set("word", word); S.data = d;
  if (!S.a) { S.a = d.teams[0].rid; S.b = d.teams[1].rid; }
  render();
}

function calculator(root) {
  const d = S.data;
  const teamOpts = (sel) => d.teams.map((t) => `<option value="${t.rid}" ${t.rid === sel ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  const v = el(`<div><p class="dim small" style="margin:4px 0 10px">Pick two teams, tap what each one gives. ${S.src === "both" ? "Numbers are FantasyCalc and Dynasty Daddy side by side; the verdict uses both." : `Numbers are ${SRC_NAME[S.src]}'s.`}</p>
    <div class="sides"><div class="side" id="sideA"></div><div class="side" id="sideB"></div></div><div id="verdict"></div></div>`);
  root.appendChild(v);
  const drawSide = (key) => {
    const box = $(key === "a" ? "#sideA" : "#sideB", v), rid = S[key], t = d.byRid[rid], give = S.give[key], other = key === "a" ? "b" : "a";
    const ids = d.holdings[rid];
    const groups = ["QB", "RB", "WR", "TE", "PICK"].map((pos) => [pos, ids.filter((id) => d.assets[id].pos === pos).sort((x, y) => val(d.assets[y]) - val(d.assets[x]))]).filter(([, l]) => l.length);
    const vals = (a) => S.src === "both" ? `<span class="vals"><b>${fmt(val(a))}</b>${a.fc ? fmt(a.fc) : "–"} · ${a.dd ? fmt(a.dd) : "–"}</span>` : `<span class="vals"><b>${fmt(val(a))}</b></span>`;
    box.innerHTML = `<div class="hd">${badge(t)}<select aria-label="Team ${key.toUpperCase()}">${teamOpts(rid)}</select></div><div class="rec">${t.wins}–${t.losses}${t.ties ? `–${t.ties}` : ""} · seed ${t.seed} · ${contending(t, d) ? "contending" : "rebuilding"}</div>
      <div class="lab">${esc(t.k)} gives</div><div class="gives">${give.size ? [...give].map((id) => { const a = d.assets[id]; return `<span class="asset"><span class="pos ${a.pos}">${a.pos === "PICK" ? "PICK" : a.pos}</span>${esc(a.name)}<span class="v num">${fmt(val(a))}</span><button type="button" class="x" data-rm="${id}" aria-label="Remove">✕</button></span>`; }).join("") : `<span class="empty">Nothing yet. Tap players or picks below.</span>`}</div>
      <div class="roster">${groups.map(([pos, l]) => `<div class="grp">${pos === "PICK" ? "Draft picks" : pos}</div>` + l.map((id) => { const a = d.assets[id]; return `<button type="button" data-id="${id}" class="${give.has(id) ? "in" : ""}" aria-pressed="${give.has(id)}"><span class="pos ${a.pos}">${a.pos === "PICK" ? a.round + (["st", "nd", "rd"][a.round - 1] || "th") : a.pos}</span><span>${esc(a.name)}<small>${a.kind === "pick" ? `${a.season} rookie draft` : `${esc(a.team || "FA")}${a.age ? ` · ${Math.floor(a.age)}` : ""}${a.posRank ? ` · ${a.pos}${a.posRank}` : ""}`}</small></span>${vals(a)}</button>`; }).join("")).join("")}</div>`;
    $("select", box).onchange = (e) => { const nrid = Number(e.target.value); if (nrid === S[other]) { S[other] = S[key]; S.give[other] = new Set(); } S[key] = nrid; S.give[key] = new Set(); drawSide("a"); drawSide("b"); drawVerdict(); };
    box.querySelectorAll(".roster button").forEach((b) => b.onclick = () => { const id = b.dataset.id; give.has(id) ? give.delete(id) : give.add(id); drawSide(key); drawVerdict(); });
    box.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { give.delete(b.dataset.rm); drawSide(key); drawVerdict(); });
  };

    const box = $("#verdict", v), A = d.byRid[S.a], B = d.byRid[S.b], ga = [...S.give.a].map((id) => d.assets[id]), gb = [...S.give.b].map((id) => d.assets[id]);
    if (!ga.length && !gb.length) { box.innerHTML = ""; return; }

    const line = (src) => { const x = sum(ga, src), y = sum(gb, src); const tot = x + y || 1, diff = Math.abs(x - y) / Math.max(x, y, 1); const w = x > y ? B : A; // the side receiving more value wins
      return { src, x, y, diff, winner: diff < 0.05 ? null : w, text: diff < 0.05 ? "Dead even" : `${w.k} wins by ${Math.round(diff * 100)}%`, pct: (x / tot) * 100 }; };
    const L = srcs.map(line), main = S.src === "both" ? line("both") : L[0];
    const agree = L.length === 2 && ((L[0].winner && L[1].winner && L[0].winner === L[1].winner) || (!L[0].winner && !L[1].winner));
    const headline = main.winner ? `${main.winner.name} wins this one` : "Call it even";
    const sub = main.winner ? `${main.winner.k} takes in ${fmt(Math.abs(main.x - main.y))} more value (${Math.round(main.diff * 100)}%)${S.src === "both" ? agree ? ", and both sites agree." : ", but the two sites don't agree; see below." : "."}` : `Within ${Math.round(main.diff * 100)}%${S.src === "both" ? agree ? ", and both sites say so." : " overall, though the two sites lean different ways." : "."}`;
    const rows = (list, who) => list.map((a) => `<tr><td>${esc(a.name)} <span class="who">${esc(who.k)} gives</span></td><td class="num">${a.fc ? fmt(a.fc) : "–"}</td><td class="num">${a.dd ? fmt(a.dd) : "–"}</td><td class="num">${fmt(val(a, "both"))}</td></tr>`).join("");
    box.innerHTML = `<div class="verdict" style="--ca:var(${A.c});--cb:var(${B.c})"><div class="lab">Verdict · ${SRC_NAME[S.src]}</div><div class="big">${esc(headline)}</div><p class="small" style="margin:6px 0 0">${sub}</p>
      <div class="bar" aria-hidden="true"><i class="a" style="width:${main.pct.toFixed(1)}%"></i><i class="b" style="width:${(100 - main.pct).toFixed(1)}%"></i></div>
      <div class="legend"><span>${esc(A.k)} gives ${fmt(main.x)}</span><span>${esc(B.k)} gives ${fmt(main.y)}</span></div>
      ${S.src === "both" ? `<div class="srcline">${L.map((l) => `<div><div class="k">${SRC_NAME[l.src]}</div><div class="r ${l.winner ? "win" : "even"}">${esc(l.text)}</div><div class="small dim num">${fmt(l.x)} vs ${fmt(l.y)}</div></div>`).join("")}</div>` : ""}
      <table class="cmp"><thead><tr><th>Asset</th><th>FantasyCalc</th><th>Dynasty Daddy</th><th>Blend</th></tr></thead><tbody>${rows(ga, A)}${rows(gb, B)}
      <tr class="tot"><td>${esc(A.k)} gives</td><td class="num">${fmt(sum(ga, "fc"))}</td><td class="num">${fmt(sum(ga, "dd"))}</td><td class="num">${fmt(sum(ga, "both"))}</td></tr>
      <tr class="tot"><td>${esc(B.k)} gives</td><td class="num">${fmt(sum(gb, "fc"))}</td><td class="num">${fmt(sum(gb, "dd"))}</td><td class="num">${fmt(sum(gb, "both"))}</td></tr></tbody></table>
      <p class="note">Dynasty Daddy runs 0–9,999 and FantasyCalc tops out higher, so the Blend column puts Dynasty Daddy on FantasyCalc's scale (×${d.scale.toFixed(2)}) before averaging. Raw numbers are shown as each site publishes them.</p>
      <div class="actions"><button type="button" class="btn sm" id="copy">Copy for the group chat</button><button type="button" class="btn sm" id="clear">Clear</button></div></div>`;
    $("#copy", box).onclick = async () => { const txt = `${A.name} gives ${ga.map((a) => a.name).join(", ") || "nothing"} · ${B.name} gives ${gb.map((a) => a.name).join(", ") || "nothing"} → ${main.text} (FantasyCalc ${L[0].text}${L[1] ? `, Dynasty Daddy ${L[1].text}` : ""}). BBT trade calc: https://noahszmand-wq.github.io/big-brains-tribune/trade/`; try { await navigator.clipboard.writeText(txt); $("#copy", box).textContent = "Copied"; } catch (_) { prompt("Copy this:", txt); } };
    $("#clear", box).onclick = () => { S.give.a = new Set(); S.give.b = new Set(); drawSide("a"); drawSide("b"); drawVerdict(); };
  };
  drawSide("a"); drawSide("b"); drawVerdict();
}

function suggestions(root) {
  const d = S.data; if (!S.sugTeam) S.sugTeam = S.a;
  const v = el(`<div><div class="field" style="margin-top:4px"><label class="lab" for="sugteam">Suggestions for</label><select id="sugteam">${d.teams.map((t) => `<option value="${t.rid}" ${t.rid === S.sugTeam ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></div><div id="sugbody"><p class="dim"><span class="spin"></span> Running the numbers…</p></div></div>`);
  root.appendChild(v);
  $("#sugteam", v).onchange = (e) => { S.sugTeam = Number(e.target.value); S.tab = "sug"; render(); };
  setTimeout(() => {
    const body = $("#sugbody", v), n = needs(S.sugTeam, d), list = suggest(S.sugTeam, d), t = n.t;
    const posLabel = { QB: "QB", RB: "RB", WR: "WR", TE: "TE" };
    body.innerHTML = `<div class="needs"><div><div class="k">Mode</div><div class="v">${n.mode === "contending" ? "Contending" : "Rebuilding"}</div><div class="small dim">${t.wins}–${t.losses} · seed ${t.seed}</div></div><div><div class="k">Weakest spot</div><div class="v">${posLabel[n.weakest.pos]}</div><div class="small dim">starters avg ${fmt(n.weakest.start)}</div></div><div><div class="k">Deepest</div><div class="v">${posLabel[n.deepest.pos]}</div><div class="small dim">${fmt(n.deepest.depth)} on the bench</div></div><div><div class="k">Picks owned</div><div class="v">${n.picks}</div><div class="small dim">${d.settings.season + 1}–${d.settings.season + 2}</div></div></div>
      <p class="dim small">${n.mode === "contending" ? `${esc(t.name)} is in the hunt, so these deals are judged on this year's starting lineup.` : `${esc(t.name)} is building, so these deals are judged on youth and picks.`} Every one is within 12% on ${SRC_NAME[S.src]} values and helps the other team too, so it has a chance of actually getting accepted.</p>
      ${list.length ? list.map((s, i) => { const r = contending(s.them, d); return `<div class="sug"><span class="tag ${r ? "" : "rebuild"}">${esc(s.them.k)} is ${r ? "contending" : "rebuilding"}</span>
        <div class="row"><div><div class="k">${esc(t.k)} gives</div><ul>${s.give.map((id) => { const a = d.assets[id]; return `<li><span class="pos ${a.pos}">${a.pos === "PICK" ? "PICK" : a.pos}</span> ${esc(a.name)} <small class="num">${fmt(val(a))}</small></li>`; }).join("")}</ul></div><div class="arrow">⇄</div><div><div class="k">${badge(s.them)} gives</div><ul>${s.get.map((id) => { const a = d.assets[id]; return `<li><span class="pos ${a.pos}">${a.pos === "PICK" ? "PICK" : a.pos}</span> ${esc(a.name)} <small class="num">${fmt(val(a))}</small></li>`; }).join("")}</ul></div></div>
        <div class="why">${esc(t.k)} ${n.mode === "contending" ? "lineup" : "future"} +${fmt(s.g1)} · ${esc(s.them.k)} ${r ? "lineup" : "future"} +${fmt(s.g2)} · value ${fmt(s.gv)} for ${fmt(s.rv)}</div>
        <div class="foot"><span class="vals">#${i + 1}</span><button type="button" class="btn sm" data-load="${i}">Open in calculator</button></div></div>`; }).join("") : `<div class="card dim">No fair, win-win deals found for ${esc(t.name)} right now. Try the other value source, or build one by hand in the calculator.</div>`}`;
    body.querySelectorAll("[data-load]").forEach((b) => b.onclick = () => { const s = list[Number(b.dataset.load)]; S.a = S.sugTeam; S.b = s.them.rid; S.give.a = new Set(s.give); S.give.b = new Set(s.get); S.tab = "calc"; render(); window.scrollTo(0, 0); });
  }, 30);
}

// ---------- source toggle + boot ----------
$("#src").querySelectorAll("button").forEach((b) => b.onclick = () => { S.src = b.dataset.s; store.set("tradesrc", S.src); $("#src").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); if (S.data) render(); });
$("#src").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.s === S.src)));
$("#brand").onclick = (e) => { e.preventDefault(); S.tab = "calc"; if (S.data) render(); };
if (S.word) start(S.word).catch(() => { S.word = null; render(); }); else render();
})();
</script>
